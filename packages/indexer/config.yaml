# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
# Turnstile indexer. The factory address and start block per chain are written by `pnpm sync-config`
# from packages/contracts/deployments/<chainId>.json — edit that, not the chains block.
name: turnstile
description: Identity-bound tickets on Monad — events, seats, fans and the live door feed
handlers: src/handlers
rollback_on_reorg: false
field_selection:
  transaction_fields:
    - hash
contracts:
  - name: TurnstileFactory
    events:
      - event: "EventCreated(uint256 indexed eventId, address indexed eventAddress, address indexed organiser, string name, bytes32 venue, uint64 startsAt)"
  - name: TurnstileEvent
    events:
      - event: "TicketMinted(uint256 indexed tokenId, address indexed to, uint8 indexed tier, uint96 faceValue, bool comp)"
      - event: "DoorKeyBound(uint256 indexed tokenId, address indexed doorKey, address previous, address by)"
      - event: "DoorKeyCleared(uint256 indexed tokenId, address previous)"
      - event: "Listed(uint256 indexed tokenId, address indexed seller, uint96 price)"
      - event: "Delisted(uint256 indexed tokenId)"
      - event: "ListingFilled(uint256 indexed tokenId, address indexed seller, address indexed buyer, uint96 price, uint96 fee)"
      - event: "CheckedIn(uint256 indexed tokenId, address indexed holder, address indexed doorKey, address gate, uint64 slot)"
chains:
  # --- generated by scripts/sync-config.mjs from packages/contracts/deployments/*.json ---
  - id: 10143 # Monad testnet — pending deployment (deployments/10143.json)
    start_block: 0
    contracts:
      - name: TurnstileFactory
        address: "0x0000000000000000000000000000000000000000"
      - name: TurnstileEvent # registered dynamically from EventCreated
  # --- end generated ---
